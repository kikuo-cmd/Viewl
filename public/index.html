<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewl</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #ff0055;
      --border-color: #333333;
      --input-bg: #2a2a2a;
    }

    [data-theme="light"] {
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
      --text-color: #000000;
      --border-color: #e0e0e0;
      --input-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg-color); color: var(--text-color); transition: background 0.3s; padding-bottom: 40px; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; border-bottom: 1px solid var(--border-color); background: var(--bg-color);
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 1.5rem; font-weight: 900; color: var(--accent-color); }
    .search-bar {
      background: var(--input-bg); border: 1px solid var(--border-color);
      padding: 8px 16px; border-radius: 20px; color: var(--text-color); width: 220px;
    }

    .btn {
      background: var(--accent-color); color: #fff; border: none;
      padding: 10px 18px; border-radius: 12px; font-weight: bold; cursor: pointer;
    }
    .btn:active { opacity: 0.8; }
    .btn-secondary { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); }
    .btn-cancel { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); }

    #step-entry {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 80vh; gap: 16px;
    }
    .code-input {
      font-size: 1.0rem; padding: 12px; border-radius: 12px;
      border: 1px solid var(--border-color); background: var(--input-bg);
      color: var(--text-color); width: 100%; margin-bottom: 10px;
    }

    #step-home { display: none; padding: 20px; max-width: 1000px; margin: 0 auto; }
    .section-title { font-size: 1.1rem; margin: 24px 0 12px; font-weight: bold; }

    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .video-card { background: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid var(--border-color); }
    .video-card video { width: 100%; aspect-ratio: 16/9; background: #000; object-fit: cover; }
    .video-info { padding: 12px; display: flex; justify-content: space-between; align-items: center; }

    /* モーダル */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-card {
      background: var(--card-bg); border-radius: 20px; padding: 24px;
      width: 90%; max-width: 420px; border: 1px solid var(--border-color);
      animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popUp {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .tab-header { display: flex; gap: 10px; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); }
    .tab-btn { padding: 8px 16px; border: none; background: none; color: var(--text-color); cursor: pointer; opacity: 0.6; font-weight: bold; }
    .tab-btn.active { opacity: 1; border-bottom: 2px solid var(--accent-color); }

    .file-drop-area {
      border: 2px dashed var(--border-color); border-radius: 12px; padding: 20px;
      text-align: center; cursor: pointer; margin-bottom: 12px; background: var(--input-bg);
    }
  </style>
</head>
<body data-theme="dark">

  <div id="step-entry">
    <h1 class="logo" style="font-size: 2.5rem;">Viewl</h1>
    <p style="opacity: 0.8;">グループ参加コードを入力して入室</p>
    <input type="text" id="codeInput" class="code-input" style="width: 260px; text-align: center;" placeholder="コード (例: 101020)" maxlength="6">
    <button class="btn" style="width: 260px;" onclick="handleEnterGroup()">入室する</button>
  </div>

  <div id="step-home">
    <header style="margin-bottom: 20px; padding: 0; border: none;">
      <div class="logo">Viewl</div>
      <input type="text" class="search-bar" placeholder="動画を検索...">
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="btn-secondary btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
        <button class="btn-secondary btn" onclick="openUploadModal()">+ 投稿</button>
        <button class="btn" id="userBtn" onclick="openAuthModal()">ログイン / 登録</button>
      </div>
    </header>

    <div class="section-title">🔥 話題・人気の横動画</div>
    <div id="horizontal-videos" class="video-grid"></div>

    <div class="section-title">⚡ 人気のショート動画 (最大2分)</div>
    <div id="short-videos" class="video-grid"></div>

    <div class="section-title">✨ 新着・すべての動画</div>
    <div id="recent-videos" class="video-grid"></div>
  </div>

  <div id="authModal" class="modal-overlay">
    <div class="modal-card">
      <div class="tab-header">
        <button class="tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">ログイン</button>
        <button class="tab-btn" id="tabRegister" onclick="switchAuthTab('register')">新規登録</button>
      </div>

      <div id="formLogin">
        <input type="text" id="loginId" class="code-input" placeholder="チャンネルID (@ID)">
        <input type="password" id="loginPass" class="code-input" placeholder="パスワード">
        <div style="display:flex; gap:10px; margin-top:12px;">
          <button class="btn btn-cancel" style="flex:1;" onclick="closeAuthModal()">キャンセル</button>
          <button class="btn" style="flex:1;" onclick="handleLogin()">ログイン</button>
        </div>
      </div>

      <div id="formRegister" style="display: none;">
        <input type="text" id="regId" class="code-input" placeholder="チャンネルID (英数字)">
        <input type="text" id="regName" class="code-input" placeholder="チャンネル名 (表示名)">
        <input type="password" id="regPass" class="code-input" placeholder="パスワード">
        <div style="display:flex; gap:10px; margin-top:12px;">
          <button class="btn btn-cancel" style="flex:1;" onclick="closeAuthModal()">キャンセル</button>
          <button class="btn" style="flex:1;" onclick="handleRegister()">アカウント作成</button>
        </div>
      </div>
    </div>
  </div>

  <div id="uploadModal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-bottom: 12px;">動画ファイルを投稿</h3>
      <input type="text" id="uploadTitle" class="code-input" placeholder="動画タイトル">
      
      <div class="file-drop-area" onclick="document.getElementById('videoFile').click()">
        <span id="fileLabel">📁 動画ファイルを選択</span>
        <input type="file" id="videoFile" accept="video/*" style="display: none;" onchange="handleFileSelect(event)">
      </div>

      <label style="display: flex; gap: 8px; align-items: center; font-size: 0.9rem; margin-bottom: 16px;">
        <input type="checkbox" id="isShortCheck"> ショート動画として投稿
      </label>

      <div style="display: flex; gap: 10px;">
        <button class="btn btn-cancel" style="flex: 1;" onclick="closeUploadModal()">キャンセル</button>
        <button class="btn" id="uploadBtn" style="flex: 1;" onclick="handleUpload()">投稿する</button>
      </div>
    </div>
  </div>

  <script>
    let currentGroupCode = "";
    let currentUser = null;
    let selectedFile = null;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
    }

    async function handleEnterGroup() {
      const code = document.getElementById('codeInput').value.trim();
      if (!code) return alert('コードを入力してください');

      try {
        const res = await fetch('/api/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();
        if (data.success) {
          currentGroupCode = code;
          document.getElementById('step-entry').style.display = 'none';
          document.getElementById('step-home').style.display = 'block';
          loadVideos();
        }
      } catch (err) { alert("接続エラー"); }
    }

    function switchAuthTab(tab) {
      if (tab === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabRegister').classList.remove('active');
        document.getElementById('formLogin').style.display = 'block';
        document.getElementById('formRegister').style.display = 'none';
      } else {
        document.getElementById('tabRegister').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('formLogin').style.display = 'none';
        document.getElementById('formRegister').style.display = 'block';
      }
    }

    async function handleRegister() {
      const channelId = document.getElementById('regId').value.trim();
      const channelName = document.getElementById('regName').value.trim();
      const password = document.getElementById('regPass').value.trim();

      if (!channelId || !channelName || !password) return alert('全項目を入力してください');

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ channelId, channelName, password, groupCode: currentGroupCode })
        });
        const data = await res.json();
        if (data.success) {
          currentUser = data.user;
          document.getElementById('userBtn').innerText = currentUser.channelName;
          closeAuthModal();
        } else { alert(data.message); }
      } catch (err) { alert("登録エラー"); }
    }

    async function handleLogin() {
      const channelId = document.getElementById('loginId').value.trim();
      const password = document.getElementById('loginPass').value.trim();

      if (!channelId || !password) return alert('IDとパスワードを入力してください');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ channelId, password })
        });
        const data = await res.json();
        if (data.success) {
          currentUser = data.user;
          document.getElementById('userBtn').innerText = currentUser.channelName;
          closeAuthModal();
        } else { alert(data.message); }
      } catch (err) { alert("ログインエラー"); }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        selectedFile = file;
        document.getElementById('fileLabel').innerText = `🎥 ${file.name}`;
      }
    }

    // 動画データ取得 & 表示
    async function loadVideos() {
      try {
        const res = await fetch(`/api/videos?groupCode=${currentGroupCode}`);
        const data = await res.json();

        const recentContainer = document.getElementById('recent-videos');
        const shortContainer = document.getElementById('short-videos');
        recentContainer.innerHTML = ''; shortContainer.innerHTML = '';

        if (data.success && data.videos.length > 0) {
          data.videos.forEach(video => {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
              <video src="${video.video_url}" controls preload="metadata"></video>
              <div class="video-info">
                <div>
                  <div style="font-weight:bold;">${video.title}</div>
                  <div style="font-size:0.8rem; opacity:0.7;">${video.author_id || 'ゲスト'}</div>
                </div>
                <button class="btn btn-cancel" style="padding: 4px 8px; font-size: 0.8rem;" onclick="deleteVideo('${video.id}')">🗑️</button>
              </div>
            `;
            if (video.is_short) shortContainer.appendChild(card);
            else recentContainer.appendChild(card);
          });
        } else {
          recentContainer.innerText = "まだ動画はありません。";
        }
      } catch (err) {
        console.error(err);
      }
    }

    // 🗑️ 動画削除
    async function deleteVideo(videoId) {
      if (!confirm("この動画を削除しますか？")) return;

      try {
        const res = await fetch('/api/videos/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ videoId })
        });
        const data = await res.json();
        if (data.success) {
          loadVideos();
        } else {
          alert("削除に失敗しました");
        }
      } catch (err) { alert("削除エラー"); }
    }

    // ☁️ Cloudinaryダイレクトアップロード & DB保存
    async function handleUpload() {
      const title = document.getElementById('uploadTitle').value.trim();
      const isShort = document.getElementById('isShortCheck').checked;
      const uploadBtn = document.getElementById('uploadBtn');

      if (!title) return alert('タイトルを入力してください');
      if (!selectedFile) return alert('動画ファイルを選択してください');

      uploadBtn.innerText = "動画を送信中...";
      uploadBtn.disabled = true;

      try {
        // 1. Cloudinaryへのダイレクトアップロード
        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('upload_preset', 'ml_default');
        formData.append('cloud_name', 'ds9pipwk0');

        const cloudRes = await fetch('https://api.cloudinary.com/v1_1/ds9pipwk0/video/upload', {
          method: 'POST',
          body: formData
        });

        const cloudData = await cloudRes.json();
        if (!cloudData.secure_url) {
          throw new Error(cloudData.error?.message || "Cloudinaryのアップロードに失敗しました");
        }

        // 2. Supabaseへ投稿データを保存
        const res = await fetch('/api/videos/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title,
            videoUrl: cloudData.secure_url,
            isShort,
            authorName: currentUser ? currentUser.channelName : 'ゲスト',
            groupCode: currentGroupCode
          })
        });

        const data = await res.json();
        if (data.success) {
          closeUploadModal();
          loadVideos();
        } else {
          alert("データベースの保存に失敗しました");
        }
      } catch (err) {
        alert(`投稿エラー: ${err.message}`);
      } finally {
        uploadBtn.innerText = "投稿する";
        uploadBtn.disabled = false;
      }
    }

    function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
    function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
    
    function openUploadModal() { 
      if (!currentUser) return openAuthModal();
      document.getElementById('uploadModal').style.display = 'flex'; 
    }

    function closeUploadModal() { 
      document.getElementById('uploadModal').style.display = 'none'; 
      document.getElementById('uploadTitle').value = '';
      document.getElementById('videoFile').value = '';
      document.getElementById('fileLabel').innerText = '📁 動画ファイルを選択';
      document.getElementById('isShortCheck').checked = false;
      selectedFile = null;
    }
  </script>
</body>
</html>
